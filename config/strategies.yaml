############################################################################################
# Trading Strategy YAML config.
#
# - You configure the loading of your strategy using either a className or a beanName field.
# - All fields are mandatory unless stated otherwise.
# - Multiple strategy blocks can be listed.
# - The indentation levels are significant in YAML: https://en.wikipedia.org/wiki/YAML
#
# See the README "How do I write my own Trading Strategy?" section for full details.
############################################################################################
---
strategies:

  # A unique identifier for the strategy. The markets.yaml tradingStrategyId entries reference this.
  # Value must be an alphanumeric string. Underscores and dashes are also permitted. E.g. scalping-strategy
  - id: scalping-strategy

    # A friendly name for the strategy. Value must be an alphanumeric string. Spaces are allowed. E.g. My Super Strat
    name: Basic Scalping Strat

    # The description value is optional.
    description: >
      A simple trend following scalper that buys at the current BID price,
      holds until current market price has reached a configurable minimum percentage gain,
      and then sells at current ASK price, thereby taking profit from the spread.
      Don't forget to factor in the exchange fees!

    # For the className value, you must specify the fully qualified name of your Strategy class for the Trading Engine
    # to load and execute. This class must be on the runtime classpath.
    # If you set this value to load your strategy, you cannot set the beanName value.
    #
    #className: com.gazbert.bxbot.strategies.ExampleScalpingStrategy

    # For the beanName value, you must specify the Spring bean name of you Strategy component class
    # for the Trading Engine to load and execute.
    # You will also need to annotate your strategy class with `@Component("exampleScalpingStrategy")` -
    # take a look at ExampleScalpingStrategy.java. This results in Spring injecting the bean.
    # (see https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/stereotype/Component.html)
    # If you set this value to load your strategy, you cannot set the className value.
    beanName: exampleScalpingStrategy

    # The configItems section is optional and allows you to set custom key/value pair config items. This config
    # is passed to your Trading Strategy when the bot starts up.
    configItems:
      counter-currency-buy-order-amount: 20
      minimum-percentage-gain: 2

  # Moving Average Channel Breakout Strategy
  # Combines EMA crossover (trend filter) with Donchian channel breakout (entry signal).
  # Set test-mode: true for dry-run logging without real orders.
  - id: ma-channel-breakout-strategy

    name: Moving Average Channel Breakout

    description: >
      Uses EMA crossover as a trend filter and Donchian channel breakout for entry/exit signals.
      A BUY is triggered when the short EMA is above the long EMA and price breaks above the upper
      channel. A SELL (or stop-loss) closes the position when trend reverses or price drops too far.
      Enable test-mode to log signals without placing real orders.

    beanName: movingAverageChannelBreakout

    configItems:
      # Amount of counter currency (e.g. USD) to spend on each buy order
      counter-currency-buy-order-amount: 20
      # Short EMA period (must be less than long-ema-period)
      short-ema-period: 10
      # Long EMA period
      long-ema-period: 20
      # Donchian channel lookback period
      channel-period: 20
      # Stop-loss percentage below the buy entry price (e.g. 2.0 = 2%)
      stop-loss-percentage: 2.0
      # Set to true for dry-run mode: signals are logged but no real orders are placed
      test-mode: true

  # Mean Reversion Strategy (RSI + Bollinger Bands)
  # Long-only: buys oversold dips onto the lower Bollinger band while the market is ranging,
  # sells back at the moving average. Sizing and stop-loss are driven by ATR.
  # Set test-mode: true for dry-run logging without real orders.
  - id: mean-reversion-rsi-bollinger-strategy

    name: Mean Reversion RSI Bollinger

    description: >
      Mean reversion strategy combining Bollinger Bands and the RSI, gated by an ADX regime filter.
      A BUY is triggered when the market is NOT trending (ADX below the threshold), the last close
      is at or below the lower Bollinger band, and the RSI is oversold. The position is closed when
      price reverts to the middle band, the RSI turns neutral, the ATR stop-loss is hit, or the
      position has been held for too many candles. A max drawdown kill switch halts trading.
      BX-bot is spot only, so short setups are logged but never traded.
      Enable test-mode to log signals without placing real orders.

    beanName: meanReversionRsiBollinger

    configItems:
      # Length of each aggregated candle, in seconds. Candles are built from the ticker, one sample
      # per trade cycle, so this should be a multiple of engine.yaml tradeCycleInterval.
      # 300 = 5 minute candles. Warm-up is 29 candles with the periods below.
      candle-seconds: 300
      # Bollinger Bands: moving average length and standard deviation multiplier
      bollinger-period: 20
      bollinger-std-dev-multiplier: 2.0
      # RSI period and thresholds. Must satisfy oversold < exit < overbought.
      rsi-period: 14
      rsi-oversold-threshold: 30
      rsi-overbought-threshold: 70
      rsi-exit-threshold: 50
      # ATR period and the stop-loss distance as a multiple of the ATR
      atr-period: 14
      atr-stop-loss-multiplier: 2.0
      # ADX regime filter: no new entries while ADX is at or above this threshold (trending market)
      adx-period: 14
      adx-trend-threshold: 25
      # Time exit: close the position if it has not reverted within this many candles
      max-holding-candles: 24
      # Simulated starting capital, in counter currency, used for sizing and the drawdown tracker
      starting-capital: 1000
      # Percentage of equity risked per trade if the stop-loss is hit
      risk-per-trade-percentage: 1.0
      # Hard cap on the counter currency spent per order
      counter-currency-buy-order-amount: 20
      # Trading halts when equity falls this far below its peak
      max-drawdown-percentage: 15.0
      # Set to true for dry-run mode: signals are logged but no real orders are placed
      test-mode: true
